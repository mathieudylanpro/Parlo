<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{padding:28px 20px 8px}

.sub{margin:4px 0 0;color:var(--mut);font-size:15px}
.tabs{display:flex;gap:8px;padding:12px 20px}
.tab{flex:1;padding:12px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-weight:600}
.tab.on{border-color:var(--acc);background:var(--acc);color:var(--accfg)}
.btn{padding:13px 18px;border:0;border-radius:12px;background:var(--acc);color:var(--accfg);font-weight:700}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.wide{width:100%}

.units{padding:8px 20px 12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:40px 1fr;gap:4px 12px;align-items:center}
.num{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700}
.ct{display:flex;flex-direction:column}
.ct span{color:var(--mut);font-size:14px}
.acts{grid-column:1/-1;display:flex;gap:8px;margin-top:8px}
.acts .btn{flex:1;padding:10px}
.foot-note{padding:8px 20px 28px;color:var(--mut);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;padding:8px 0;font-size:14px}
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{background:none;border:0;font-size:26px;line-height:1;padding:4px 8px;color:var(--mut)}
.prog{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .25s}
.stage{flex:1;padding:8px 20px 20px;display:flex;flex-direction:column;gap:16px}
.stage.scroll{overflow:auto}
.stage h2{margin:0}
.note{margin:0;padding:10px 12px;background:var(--card);border-left:4px solid var(--acc);border-radius:8px;color:var(--mut);font-size:15px}
.ask{margin:0;color:var(--mut);font-size:15px}
.prompt{font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{padding:15px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.opt.good{background:var(--ok);border-color:var(--okfg);color:var(--okfg)}
.opt.wrong{background:var(--bad);border-color:var(--badfg);color:var(--badfg)}
.opt:disabled:not(.good):not(.wrong){opacity:.55}
.spk{background:var(--card);border:1.5px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:18px;flex:none}
.big-spk{align-self:center;width:96px;height:96px;border-radius:50%;border:0;background:var(--acc);color:var(--accfg);font-size:40px}
.txt{width:100%;padding:14px;font-size:20px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
.chars{display:flex;gap:6px;flex-wrap:wrap}
.chars button{padding:8px 12px;background:var(--card);border:1.5px solid var(--line);border-radius:10px}
.ans{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:10px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;font-size:18px}
.tile.ghostt{visibility:hidden}
.foot{padding:14px 20px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;position:sticky;bottom:0;background:var(--bg)}
.foot:empty{display:none}
.foot.ok{background:var(--ok);color:var(--okfg)}
.foot.bad{background:var(--bad);color:var(--badfg)}
.foot.ok .btn{background:var(--okfg);color:var(--ok)}
.foot.bad .btn{background:var(--badfg);color:var(--bad)}
.msg{display:flex;flex-direction:column;gap:2px}
.msg .ex{font-size:14px;opacity:.85}
.vocab{display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.vrow div{display:flex;flex-direction:column}
.vrow span{color:var(--mut);font-size:15px}
.res{text-align:center;padding-top:30px}
.res .big{font-size:56px;font-weight:800;color:var(--acc)}
.miss{text-align:left;display:flex;flex-direction:column;gap:6px}
.lvl{margin:14px 0 0;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.pad{padding:4px 20px 8px}
.spkgrp{display:flex;gap:6px;flex:none}
.row{display:flex;gap:16px;justify-content:center}
.big-spk.sm{width:72px;height:72px;font-size:30px}
.big-spk.slow{background:var(--card);color:var(--fg);border:1.5px solid var(--line)}
.prompt.sm{font-size:22px;line-height:1.35}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.opt.sm{font-size:15px;padding:12px 10px}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.sub{margin:0;color:var(--mut);font-size:15px}

.toprow{display:flex;justify-content:space-between;align-items:center}
.oral{display:flex;gap:8px;padding:4px 20px 8px}
.oral .btn{flex:1;padding:11px 8px}
.btn.bac{background:#9a3b1f;color:#fff;margin:4px 20px 8px}
.heard{min-height:24px;margin:8px 0;color:var(--fg);font-style:italic}
.mic{width:100%;padding:16px;border-radius:14px;border:2px solid var(--acc);background:var(--card);font-weight:700}
.mic.on{background:var(--bad);border-color:var(--badfg);color:var(--badfg)}
.micbox{display:flex;flex-direction:column;gap:6px}
.speakarea{display:flex;flex-direction:column;gap:12px}
.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between;align-items:center}
.center{text-align:center}
.togs{display:flex;gap:14px;flex-wrap:wrap}
.tg{display:flex;gap:6px;align-items:center;font-size:15px}
.lrow.hl,.bub.hl{border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.vocab.mask .vrow b,.vocab.mask .vrow span{visibility:hidden}
.dlg{display:flex;flex-direction:column;gap:8px}
.bub{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.bub.B{background:var(--bg)}
.bub>div{flex:1;display:flex;flex-direction:column}
.bub .ff,.vrow .ff{color:var(--mut);font-size:14px}
.who{width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.dpanel{display:flex;flex-direction:column;gap:10px;padding:8px 0 20px}
.dcard{grid-template-columns:1fr auto}
.pron{display:block}.pron p{margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.chip button{background:none;border:0;padding:8px 12px}
.chip .slow{border-left:1.5px solid var(--line);padding:8px 10px}
.set{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.set.row2{flex-direction:row;align-items:center;gap:10px}
.set select,.set input[type=range]{width:100%;padding:8px;font-size:16px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.set input[type=range]{padding:0}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;padding:6px 12px;border-radius:10px;background:var(--card);border:1.5px solid var(--line)}
.timer.over{color:var(--badfg);background:var(--bad)}
.ta{width:100%;padding:12px;font:inherit;font-size:17px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);resize:vertical}
.okc{color:var(--okfg)}.warn{color:var(--badfg)}
.text p{margin:0 0 12px;line-height:1.5}
.qb{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.script{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px}
.script.hidden{display:none}
.script p{margin:0 0 8px}
.resbox{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.fb{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1.5px solid var(--acc);border-radius:14px;padding:12px}
.fb ul{margin:4px 0 0;padding-left:20px}
.err .bad{color:var(--badfg);text-decoration:line-through}
.model{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:10px}
.grid{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .btn{padding:14px 8px}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.big2{font-size:21px}
details{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
details summary{cursor:pointer;font-weight:600}
.bt{flex:1;font-size:16px}
.toast{position:fixed;left:12px;right:12px;bottom:14px;z-index:9;background:var(--badfg);color:var(--bad);padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.35;box-shadow:0 4px 18px #0004}
.trow{display:flex;align-items:center;gap:6px}
.chip2{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextcard{display:flex;flex-direction:column;gap:6px;margin:6px 20px 10px;padding:14px;border-radius:16px;background:var(--card);border:2px solid var(--acc)}
.mbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.mbar i{display:block;height:100%;background:var(--acc)}
.mtxt{font-size:12px!important}
.goal{margin:0 20px 10px;padding:10px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:2px}
.goal.done{border-color:var(--acc)}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--mut)}
.chart .col i{display:block;width:100%;max-width:34px;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px}
.chart .col.off i{background:var(--line)}
.stat3{display:flex;gap:8px}
.stat3>div{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column}
.stat3 b{font-size:20px}.stat3 span{font-size:12px;color:var(--mut)}
.hrow{display:flex;align-items:center;gap:8px;font-size:14px}
.hrow .mbar{flex:1;margin:0}

.big.small{font-size:40px}
#app>.btn.wide.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
</style>

<script>

const P=s=>s.trim().split('\n').map(l=>{const [t,f]=l.split('|');return{t:t.trim(),f:f.trim()}});

const COURSES={
en:{name:'Anglais',lang:'en-US',levels:[[0,'Niveau A1 · Débutant'],[8,'Niveau A1+ · Vie quotidienne'],[16,'Niveau A2 · Élémentaire'],[22,'Niveau B1 · Intermédiaire'],[27,'Niveau B1+ · Vers l\'aisance']],units:[
{t:'Les bases',n:"« Thank you » : pour le « th », place la langue entre les dents et souffle doucement.",i:P(`
Hello|Bonjour
Goodbye|Au revoir
Please|S'il vous plaît
Thank you|Merci
Yes|Oui
No|Non
Sorry|Désolé
Good evening|Bonsoir
Good night|Bonne nuit
See you soon|À bientôt`)},
{t:'Se présenter',n:"« To be » (être) : I am, you are, he/she is, we are, they are. Le pronom est toujours obligatoire en anglais.",i:P(`
My name is Paul|Je m'appelle Paul
I am French|Je suis français
How are you?|Comment allez-vous ?
I am fine|Je vais bien
Nice to meet you|Enchanté
Where are you from?|D'où venez-vous ?
I live in France|J'habite en France
I am a teacher|Je suis professeur
Do you speak English?|Parlez-vous anglais ?
I do not understand|Je ne comprends pas`)},
{t:'Les nombres',n:"De 13 à 19, on termine par « -teen » (thirteen, fourteen…). Les dizaines finissent par « -ty » (twenty, thirty…).",i:P(`
One|Un
Two|Deux
Three|Trois
Four|Quatre
Five|Cinq
Ten|Dix
Twenty|Vingt
One hundred|Cent
How much is it?|Combien ça coûte ?
It is expensive|C'est cher`)},
{t:'Manger et boire',n:"« I would like… » = « Je voudrais… ». C'est la formule polie au restaurant.",i:P(`
Water|L'eau
Bread|Le pain
Cheese|Le fromage
Apple|La pomme
Coffee|Le café
Milk|Le lait
Chicken|Le poulet
I am hungry|J'ai faim
I would like a coffee|Je voudrais un café
The bill, please|L'addition, s'il vous plaît`)},
{t:'La famille',n:"En anglais, les noms n'ont pas de genre : « the » sert pour le masculin, le féminin et le pluriel.",i:P(`
Mother|La mère
Father|Le père
Brother|Le frère
Sister|La sœur
Son|Le fils
Daughter|La fille
Friend|L'ami
I have two sisters|J'ai deux sœurs
My father is tall|Mon père est grand
She is my wife|C'est ma femme`)},
{t:'Lieux et directions',n:"« Turn » = tourner, « straight » = tout droit. Les directions utilisent souvent l'impératif : Turn left, Go straight.",i:P(`
House|La maison
Street|La rue
Train station|La gare
Airport|L'aéroport
Left|À gauche
Right|À droite
Where is the station?|Où est la gare ?
Turn left|Tournez à gauche
I am lost|Je suis perdu
Go straight ahead|Allez tout droit`)},
{t:'Le temps et les jours',n:"Les jours de la semaine prennent toujours une majuscule en anglais : Monday, Friday…",i:P(`
Today|Aujourd'hui
Tomorrow|Demain
Yesterday|Hier
Monday|Lundi
Friday|Vendredi
Sunday|Dimanche
What time is it?|Quelle heure est-il ?
It is nine o'clock|Il est neuf heures
See you tomorrow|À demain
I work every day|Je travaille tous les jours`)},
{t:'Verbes courants',n:"À la 3e personne du singulier, on ajoute -s : I drink, she drinks. Exception : have → has.",i:P(`
To eat|Manger
To drink|Boire
To go|Aller
To have|Avoir
To want|Vouloir
I want to learn English|Je veux apprendre l'anglais
She drinks water|Elle boit de l'eau
We are going home|Nous rentrons à la maison
They have a car|Ils ont une voiture
I can help you|Je peux vous aider`)},
{t:'Couleurs et adjectifs',n:"En anglais, l'adjectif est invariable (pas de féminin ni de pluriel) et se place avant le nom : a red car, two red cars.",i:P(`
Red|Rouge
Blue|Bleu
Green|Vert
Small|Petit
Hot|Chaud
Cold|Froid
The car is red|La voiture est rouge
The house is big|La maison est grande
It is very cold today|Il fait très froid aujourd'hui
I like this blue shirt|J'aime cette chemise bleue`)},
{t:'Ma journée',n:"Au présent simple, on ajoute -s à la 3e personne : I work → she works. Heures : « at seven ». Moments : « in the morning », « at night ».",i:P(`
I wake up at seven|Je me réveille à sept heures
I take a shower|Je prends une douche
I have breakfast|Je prends le petit-déjeuner
I go to work by car|Je vais au travail en voiture
I start work at nine|Je commence le travail à neuf heures
I have lunch at noon|Je déjeune à midi
I come home at six|Je rentre à dix-huit heures
I cook dinner|Je prépare le dîner
I watch television in the evening|Je regarde la télévision le soir
I go to bed at eleven|Je me couche à onze heures`)},
{t:'Poser des questions',n:"Au présent, la question se forme avec do/does + sujet + verbe à l'infinitif : Where do you live? Where does she live? (pas de -s sur le verbe).",i:P(`
What is your name?|Comment t'appelles-tu ?
Where do you live?|Où habites-tu ?
How old are you?|Quel âge as-tu ?
Who is he?|Qui est-il ?
Why are you late?|Pourquoi es-tu en retard ?
When does the train leave?|Quand part le train ?
Which one do you prefer?|Lequel préfères-tu ?
Can you repeat that, please?|Peux-tu répéter, s'il te plaît ?
What does this word mean?|Que signifie ce mot ?
How do you say this in English?|Comment dit-on ceci en anglais ?`)},
{t:'Au restaurant',n:"« Could I… ? » et « Could we… ? » sont des formules polies pour demander quelque chose. « I will have… » sert à commander.",i:P(`
A table for two, please|Une table pour deux, s'il vous plaît
Could I see the menu?|Puis-je voir la carte ?
I will have the soup|Je prendrai la soupe
Is it spicy?|Est-ce épicé ?
Do you have a vegetarian dish?|Avez-vous un plat végétarien ?
Could we have some more water?|Pourrions-nous avoir un peu plus d'eau ?
The food is delicious|La nourriture est délicieuse
Can I pay by card?|Puis-je payer par carte ?
Keep the change|Gardez la monnaie
Enjoy your meal|Bon appétit`)},
{t:'Faire les courses',n:"« How much is / does… cost? » demande un prix. Pour parler de taille : size ; pour les chaussures et vêtements : « Can I try it on? ».",i:P(`
I am just looking|Je regarde seulement
How much does this cost?|Combien coûte ceci ?
Do you have this in a larger size?|L'avez-vous en plus grand ?
Can I try it on?|Puis-je l'essayer ?
Where is the fitting room?|Où est la cabine d'essayage ?
It is too expensive|C'est trop cher
Is there a discount?|Y a-t-il une réduction ?
Do you accept credit cards?|Acceptez-vous les cartes bancaires ?
I will take it|Je le prends
Can I have a receipt?|Puis-je avoir un reçu ?`)},
{t:'Voyager',n:"Attention : « a ticket to London » (un billet pour Londres). « Check-in » et « check-out » désignent l'arrivée et le départ de l'hôtel.",i:P(`
I have a reservation|J'ai une réservation
A single room, please|Une chambre simple, s'il vous plaît
What time is check-out?|À quelle heure faut-il libérer la chambre ?
Is breakfast included?|Le petit-déjeuner est-il inclus ?
What is the Wi-Fi password?|Quel est le mot de passe du Wi-Fi ?
Where is the bus stop?|Où est l'arrêt de bus ?
One ticket to London, please|Un billet pour Londres, s'il vous plaît
Where can I buy a ticket?|Où puis-je acheter un billet ?
My flight is delayed|Mon vol est retardé
Can you call a taxi for me?|Pouvez-vous m'appeler un taxi ?`)},
{t:'La santé',n:"En anglais, on dit « I have a headache » (j'ai un mal de tête) et non « I have pain ». Pour la douleur : « It hurts ».",i:P(`
I have a headache|J'ai mal à la tête
I feel sick|Je me sens malade
I have a fever|J'ai de la fièvre

I need to rest|J'ai besoin de me reposer
I feel better today|Je me sens mieux aujourd'hui
Call an ambulance|Appelez une ambulance`)},
{t:'La météo',n:"« It » est le sujet impersonnel pour la météo : It is raining, It is sunny. En anglais britannique : favourite, en américain : favorite.",i:P(`
It is sunny|Il y a du soleil
It is raining|Il pleut
It is windy today|Il y a du vent aujourd'hui
The sky is cloudy|Le ciel est nuageux
It is freezing outside|Il gèle dehors
What is the weather like?|Quel temps fait-il ?
The weather is nice|Il fait beau
It will snow tomorrow|Il neigera demain
I need an umbrella|J'ai besoin d'un parapluie
Summer is my favourite season|L'été est ma saison préférée`)},
{t:'Le passé (prétérit)',n:"Verbes réguliers : + -ed (watch → watched). Irréguliers à connaître : go → went, eat → ate, buy → bought, see → saw. Négation et question : did + verbe à l'infinitif.",i:P(`
I went to Paris last year|Je suis allé à Paris l'année dernière
She watched a film yesterday|Elle a regardé un film hier
We ate pizza last night|Nous avons mangé une pizza hier soir
He did not come to work|Il n'est pas venu travailler

{t:'Faux amis',n:"Pièges classiques pour un francophone : actually = en fait (≠ actuellement), library = bibliothèque (≠ librairie), sensible = raisonnable (≠ sensible).",i:P(`

{t:'Le present perfect',n:"have / has + participe passé. On l'emploie pour une expérience (ever, never), un résultat présent (just, already) ou une durée jusqu'à maintenant (for, since). Pas de date précise avec lui.",i:P(`

{t:'Conditionnel et obligation',n:"If + présent → will (réel). If + prétérit → would (hypothèse). « Must not » = interdiction ; « do not have to » = pas obligé. « Should » = conseil.",i:P(`

ce:[
{t:`Il telefono in classe`,niv:`B1`,text:`In molte scuole italiane il cellulare è vietato durante le lezioni. Il ministero dell'Istruzione ha ricordato che gli studenti non possono usare il telefono in classe, nemmeno per cercare informazioni, salvo autorizzazione del professore.\n\nSecondo alcuni insegnanti, la regola ha migliorato la concentrazione e i rapporti tra i ragazzi, che durante l'intervallo tornano a parlare tra loro. Altri, invece, pensano che il divieto sia superato: oggi lo smartphone è anche uno strumento di studio, utile per consultare dizionari e mappe.\n\nGli studenti sono divisi. Chiara, 17 anni, dice: «Capisco la regola, ma preferirei imparare a usare bene il telefono, non a non usarlo». Per ora la discussione resta aperta.`,
qs:[
Q(`Que rappelle le ministère ?`,[`Le portable est interdit en classe sauf autorisation du professeur`,`Le portable est obligatoire pour les devoirs`,`Le portable est autorisé pendant les cours`],0),
Q(`Quel effet positif certains enseignants constatent-ils ?`,[`Une meilleure concentration et plus d'échanges entre élèves`,`De meilleures notes en mathématiques`,`Moins de devoirs à la maison`],0),
Q(`Quel est l'argument des opposants à l'interdiction ?`,[`Le smartphone est aussi un outil de travail`,`Le téléphone coûte trop cher`,`Les élèves sont trop fatigués`],0),
Q(`Quelle est la position de Chiara ?`,[`Elle voudrait apprendre à bien utiliser le téléphone`,`Elle refuse toute règle`,`Elle n'a pas de portable`],0),
Q(`Où en est le débat ?`,[`Il reste ouvert`,`Une loi vient d'être votée`,`La règle a été supprimée`],0)]},
{t:`Una città senza auto`,niv:`B1`,text:`Da gennaio, il centro storico di una piccola città toscana è chiuso alle automobili. I residenti possono entrare solo con un permesso speciale. Il sindaco spiega che l'obiettivo è ridurre l'inquinamento e rendere le strade più sicure per i pedoni e per i ciclisti.\n\nDopo tre mesi, i negozianti sono divisi: alcuni dicono di aver guadagnato nuovi clienti, perché la gente passeggia più volentieri; altri lamentano che gli anziani e le persone con difficoltà di movimento non riescono più ad arrivare facilmente.\n\nPer questo il comune ha attivato un servizio di navette elettriche gratuite, che passano ogni dieci minuti. I primi risultati sono incoraggianti: l'aria è più pulita e nelle vie si sente meno rumore.`,
qs:[
Q(`Que s'est-il passé en janvier ?`,[`Le centre historique a été fermé aux voitures`,`Un nouveau parking a ouvert`,`Un tramway a été inauguré`],0),
Q(`Qui peut entrer en voiture ?`,[`Les résidents avec un permis spécial`,`Tout le monde`,`Seulement les taxis`],0),
Q(`Quel est l'objectif du maire ?`,[`Réduire la pollution et sécuriser les rues`,`Augmenter les impôts`,`Attirer plus de voitures`],0),
Q(`Quel problème certains commerçants soulignent-ils ?`,[`Les personnes âgées ou à mobilité réduite accèdent difficilement au centre`,`Les loyers ont augmenté`,`Les touristes sont partis`],0),
Q(`Quelle solution la commune a-t-elle mise en place ?`,[`Des navettes électriques gratuites toutes les dix minutes`,`Des bus payants`,`Des places de parking gratuites`],0)]},
{t:`Giovani e volontariato`,niv:`B1`,text:`Sempre più giovani italiani dedicano alcune ore della settimana al volontariato. Secondo un'indagine recente, un ragazzo su quattro tra i quindici e i venticinque anni partecipa ad attività di aiuto: assiste gli anziani, distribuisce pasti ai senzatetto o aiuta i bambini con i compiti.\n\nMarco, 19 anni, racconta: «All'inizio l'ho fatto per ottenere un credito scolastico, poi ho continuato perché mi fa sentire utile». Gli esperti sottolineano che queste esperienze sviluppano il senso di responsabilità e aiutano a scoprire una vocazione professionale.\n\nTuttavia, avvertono, bisogna evitare che il volontariato sostituisca i servizi pubblici, che restano un dovere dello Stato.`,
qs:[
Q(`Quelle proportion de jeunes fait du bénévolat ?`,[`Un sur quatre`,`Un sur dix`,`La moitié`],0),
Q(`Quels exemples d'activités sont cités ?`,[`Aide aux personnes âgées, repas aux sans-abri, aide aux devoirs`,`Sport et musique`,`Travail de nuit`],0),
Q(`Pourquoi Marco a-t-il commencé ?`,[`Pour obtenir un crédit scolaire`,`Pour gagner de l'argent`,`Par obligation familiale`],0),
Q(`Que développent ces expériences selon les experts ?`,[`Le sens des responsabilités et une vocation professionnelle`,`La rapidité`,`L'esprit de compétition`],0),
Q(`Quelle mise en garde formulent-ils ?`,[`Le bénévolat ne doit pas remplacer les services publics`,`Il faut le rendre obligatoire`,`Il faut le payer`],0)]}
,
{t:`Lo smart working`,niv:`B1`,text:`Dopo la pandemia, molte aziende italiane hanno adottato lo smart working, cioè il lavoro da casa per uno o più giorni alla settimana. Secondo un'indagine, circa un lavoratore su tre desidera mantenere questa formula, perché permette di risparmiare tempo e denaro sugli spostamenti e di conciliare meglio lavoro e famiglia.\n\nTuttavia, non mancano i problemi. Alcuni lavoratori dicono di sentirsi isolati e di non riuscire a staccare la sera. Per questo molte imprese propongono una soluzione intermedia: due o tre giorni in ufficio e il resto a casa.\n\nGli esperti ricordano che il lavoro a distanza funziona solo se esistono regole chiare sugli orari e sugli obiettivi da raggiungere.`,
qs:[
Q(`Quelle proportion de travailleurs veut garder le télétravail ?`,[`Environ un sur trois`,`La moitié`,`Presque tous`],0),
Q(`Quels avantages sont cités ?`,[`Un meilleur salaire`,`Moins de réunions`,`Gain de temps et d'argent sur les trajets, meilleur équilibre avec la famille`],2),
Q(`Quel problème certains travailleurs signalent-ils ?`,[`L'isolement et la difficulté à déconnecter le soir`,`Un matériel trop cher`,`Un manque de travail`],0),
Q(`Quelle solution intermédiaire est proposée ?`,[`Travailler uniquement de chez soi`,`Deux ou trois jours au bureau et le reste à la maison`,`Travailler le week-end`],1),
Q(`Que rappellent les experts ?`,[`Qu'il faut des règles claires sur les horaires et les objectifs`,`Que le télétravail doit être obligatoire`,`Que le bureau est dépassé`],0)]},
{t:`Lo sport a scuola`,niv:`B1`,text:`In Italia le ore di educazione fisica a scuola sono tra le più basse d'Europa: in media due alla settimana, e in molte scuole elementari anche meno. Per questo il governo ha deciso di introdurre un insegnante di sport anche nella scuola primaria, a partire dal prossimo anno.\n\nI medici sono favorevoli: un bambino su quattro in Italia è in sovrappeso e passa troppo tempo davanti a uno schermo. Alcuni genitori, però, temono che le ore di sport tolgano spazio alle materie tradizionali.\n\nLe scuole che hanno già fatto la prova riferiscono che i bambini sono più attenti e più sereni. Nonostante ciò, mancano ancora le palestre in molte zone del paese.`,
qs:[
Q(`Combien d'heures d'éducation physique en moyenne par semaine ?`,[`Quatre`,`Deux`,`Cinq`],1),
Q(`Quelle décision le gouvernement a-t-il prise ?`,[`Introduire un enseignant de sport à l'école primaire`,`Supprimer l'éducation physique`,`Rendre le sport payant`],0),
Q(`Pourquoi les médecins sont-ils favorables ?`,[`Parce que le sport améliore les notes`,`Parce qu'un enfant sur quatre est en surpoids et passe trop de temps devant un écran`,`Parce que les enseignants le demandent`],1),
Q(`Que craignent certains parents ?`,[`Que le sport prenne la place des matières traditionnelles`,`Que le sport soit trop dangereux`,`Que les cours coûtent plus cher`],0),
Q(`Quel obstacle subsiste ?`,[`Le manque d'enseignants`,`Le manque de gymnases dans de nombreuses zones`,`Le manque d'élèves`],1)]}
],
ee:[
{t:`Un'email a un amico`,min:110,max:150,cons:`Tu as passé un week-end dans une ville italienne. Écris un e-mail à un ami italien pour raconter ce que tu as fait et l'inviter à venir avec toi la prochaine fois.`,it:`Hai passato un fine settimana in una città italiana. Scrivi un'email a un amico italiano: racconta cosa hai fatto e invitalo a venire con te la prossima volta.`,
aide:[`Passato prossimo: ho visitato, sono salito, abbiamo mangiato`,`Imperfetto pour décrire: faceva bel tempo, c'era molta gente`,`Invitation: Ti va di venire? Perché non vieni con me?`,`Formules: Caro… / Un abbraccio / A presto`],
mod:`Caro Luca, come stai? Ti scrivo da Firenze, dove ho passato un fine settimana magnifico. Sabato mattina ho visitato gli Uffizi e nel pomeriggio ho fatto una passeggiata lungo l'Arno, mangiando un gelato buonissimo. La sera ho cenato in una piccola trattoria: la bistecca alla fiorentina era davvero deliziosa! Domenica sono salito sulla cupola del Duomo e la vista era spettacolare. Purtroppo il tempo è passato troppo in fretta. Perché non vieni con me la prossima volta? Potremmo partire a maggio, quando il clima è piacevole, e visitare anche Siena. Fammi sapere se ti va l'idea. Un abbraccio, Anna`},
{t:`Il cellulare e i giovani`,min:130,max:170,cons:`Le téléphone portable est-il utile ou dangereux pour les jeunes ? Donne ton opinion dans un texte argumenté.`,it:`Il telefono cellulare è utile o pericoloso per i giovani? Esprimi la tua opinione in un testo argomentato.`,
aide:[`Introduction: Oggi quasi tutti i giovani hanno un cellulare…`,`Argument 1 / 2 + exemple`,`Concession: È vero che… tuttavia…`,`Conclusion: In conclusione, penso che…`],
mod:`Oggi quasi tutti i giovani hanno un cellulare e lo usano per ore ogni giorno. Ma è davvero utile o è soltanto un pericolo? Prima di tutto, il telefono permette di restare in contatto con la famiglia e con gli amici, e offre molte risorse per studiare, come dizionari, video e applicazioni. Inoltre, in caso di emergenza può essere molto utile. Tuttavia, bisogna riconoscere che un uso eccessivo può causare problemi: molti ragazzi dormono meno, si concentrano con più difficoltà e si confrontano continuamente con gli altri sui social. Secondo me, il cellulare non è né buono né cattivo: dipende da come lo si usa. Per questo penso che i genitori e la scuola debbano insegnare ai giovani a usarlo con moderazione. In conclusione, un uso consapevole rende il telefono un alleato, non un nemico.`},
{t:`Una lettera di motivazione`,min:120,max:160,cons:`Tu souhaites participer à un échange scolaire en Italie. Écris une lettre à l'école italienne pour te présenter et expliquer tes motivations.`,it:`Vuoi partecipare a uno scambio scolastico in Italia. Scrivi una lettera alla scuola italiana per presentarti e spiegare le tue motivazioni.`,
aide:[`Formule: Gentili signori, / Distinti saluti`,`Présentation: Mi chiamo… ho diciassette anni… frequento il liceo`,`Motivation: Vorrei… perché… sono interessato/a a…`,`Remerciement: La ringrazio in anticipo per…`],
mod:`Gentili signori, mi chiamo Chloé, ho diciassette anni e frequento l'ultimo anno di liceo a Nantes. Vi scrivo perché vorrei partecipare allo scambio scolastico con la vostra scuola. Studio l'italiano da quattro anni e mi piace molto la vostra cultura, soprattutto la musica, l'arte e la cucina. Vorrei migliorare il mio livello parlando ogni giorno con ragazzi italiani e scoprire un altro modo di vivere e di studiare. Inoltre, sono una persona aperta e curiosa, e mi adatto facilmente alle situazioni nuove. Sono sicura che questa esperienza sarebbe molto importante per il mio futuro. Vi ringrazio in anticipo per l'attenzione e spero di ricevere presto una vostra risposta. Distinti saluti, Chloé Martin`},
{t:`Un ricordo di viaggio`,min:120,max:160,cons:`Raconte un souvenir de voyage ou de vacances qui t'a marqué(e). Utilise le passé.`,it:`Racconta un ricordo di viaggio o di vacanze che ti è rimasto nel cuore.`,
aide:[`Cadre: Era l'estate scorsa… avevo quindici anni…`,`Événements: Ad un tratto… poi… alla fine…`,`Sentiments: ero emozionato/a, mi sono sentito/a…`,`Conclusion: Non dimenticherò mai…`],
mod:`Era l'estate di due anni fa e avevo quindici anni. Con la mia famiglia siamo andati in Puglia, in una piccola casa vicino al mare. Ogni mattina ci svegliavamo presto e andavamo in spiaggia, dove l'acqua era limpida e il cielo senza nuvole. Un giorno, però, abbiamo deciso di visitare Alberobello. Quando siamo arrivati, sono rimasta senza parole: le case bianche con il tetto a cono sembravano uscite da una fiaba. Abbiamo mangiato le orecchiette in una trattoria e abbiamo parlato a lungo con la proprietaria, che ci ha raccontato la storia del paese. Alla sera ero stanchissima ma felice. Non dimenticherò mai quel viaggio, perché ho capito quanto sia bello scoprire luoghi nuovi con le persone che si amano.`}
,
{t:`Una lettera al giornale`,min:130,max:170,cons:`Écris une lettre à un journal local pour donner ton avis sur la fermeture du cinéma de ton quartier.`,it:`Scrivi una lettera al giornale locale per esprimere la tua opinione sulla chiusura del cinema del tuo quartiere.`,
aide:[`Formule : Egregio direttore, … / Distinti saluti`,`Exposer le fait : Ho saputo che il cinema chiuderà…`,`Arguments : Prima di tutto… Inoltre…`,`Proposition : Sarebbe meglio se…`],
mod:`Egregio direttore, ho saputo con dispiacere che il cinema del nostro quartiere chiuderà alla fine del mese e le scrivo per esprimere la mia opinione. Prima di tutto, quel cinema non era soltanto una sala di proiezione: era un luogo di incontro dove i ragazzi e gli anziani potevano trascorrere una serata insieme a un prezzo accessibile. Inoltre, la sua chiusura renderà più difficile per noi giovani uscire la sera, perché il cinema più vicino si trova a venti chilometri. È vero che molte persone guardano i film a casa in streaming, tuttavia vedere un film su un grande schermo è un'esperienza diversa. Sarebbe meglio se il comune aiutasse la gestione con un contributo, oppure organizzasse proiezioni gratuite per le scuole. Spero che si trovi presto una soluzione. La ringrazio per l'attenzione e le porgo distinti saluti.`},
{t:`Il futuro dopo il liceo`,min:120,max:160,cons:`Parle de tes projets après le bac et explique pourquoi tu as fait ces choix.`,it:`Racconta quali sono i tuoi progetti per il futuro dopo la maturità e spiega perché.`,
aide:[`Futur : Dopo la maturità mi iscriverò… / Farò…`,`Conditionnel : Mi piacerebbe… / Vorrei…`,`Raisons : perché… visto che…`,`Doutes : Ho ancora qualche dubbio…`],
mod:`Dopo la maturità mi iscriverò all'università, perché vorrei lavorare nel campo delle lingue. Mi piacerebbe studiare a Bologna, che è una città viva e piena di giovani, ma per ora non ho ancora deciso. Prima di cominciare, farò un viaggio in Italia con le mie amiche: sarà una bella occasione per migliorare il mio italiano e conoscere meglio la cultura del paese. Ho ancora qualche dubbio sul mio futuro, perché non so se riuscirò a trovare un lavoro che mi piaccia davvero. Tuttavia, penso che studiare ciò che si ama sia la scelta migliore. Se avrò la possibilità, vorrei anche trascorrere un anno all'estero con il programma Erasmus. Il futuro mi preoccupa un po', ma sono molto motivata.`}
],
eo:[
{t:`Social network e adolescenti`,doc:`Secondo un sondaggio, i ragazzi italiani passano in media tre ore al giorno sui social. Molti dicono che permettono di restare in contatto con gli amici, ma una parte sente di perdere tempo e di confrontarsi troppo con gli altri.`,cons:`Présente le document, dégage les idées principales puis donne ton opinion.`,
qs:[`Quali social usi di più e perché?`,`Pensi che i social rendano le persone più sole?`,`Hai mai deciso di staccarti dal telefono? Com'è andata?`,`Quali regole daresti ai genitori?`,`Come cambierà la comunicazione tra dieci anni?`]},
{t:`Ambiente e vita quotidiana`,doc:`Molte città italiane promuovono la raccolta differenziata e le piste ciclabili. I cittadini sono invitati a ridurre la plastica e a usare i mezzi pubblici. Ma non tutti rispettano le regole, e cambiare le abitudini non è facile.`,cons:`Présente le document, explique le problème posé et défends ton point de vue.`,
qs:[`Cosa fai tu ogni giorno per l'ambiente?`,`Perché è difficile cambiare le abitudini?`,`Chi deve fare di più: i cittadini o i governi?`,`Come immagini la città ideale?`,`Hai mai partecipato a un'iniziativa ecologica?`]},
{t:`Viaggiare e scoprire altre culture`,doc:`Ogni anno milioni di turisti visitano l'Italia per l'arte, la cucina e il paesaggio. Viaggiare permette di conoscere nuove culture, ma il turismo di massa può danneggiare i luoghi più fragili, come Venezia.`,cons:`Présente le document et discute des avantages et des limites du tourisme.`,
qs:[`Qual è il viaggio più bello che hai fatto?`,`Perché è importante conoscere altre culture?`,`Quali problemi crea il turismo di massa?`,`Preferisci viaggiare da solo o in gruppo?`,`Dove vorresti andare in futuro e perché?`]},
{t:`La scuola di domani`,doc:`In Italia e in Francia si discute di come rendere la scuola più moderna: più tecnologia, meno compiti a casa, più attività pratiche. Alcuni temono però che gli studenti perdano la capacità di concentrarsi.`,cons:`Présente le document et dis comment tu imagines l'école de demain.`,
qs:[`Cosa cambieresti nella tua scuola?`,`I compiti a casa sono utili?`,`Che ruolo ha la tecnologia nell'apprendimento?`,`Come immagini il lavoro del professore tra vent'anni?`,`Che cosa pensi di fare dopo il liceo?`]},
{t:`Il lavoro e i giovani`,doc:`Molti giovani europei cercano un lavoro che unisca stipendio, passione e tempo libero. Ma il mercato è difficile: i contratti sono spesso precari e molti ragazzi vanno a lavorare all'estero.`,cons:`Présente le document, explique la situation et exprime ce que tu attends de ton futur métier.`,
qs:[`Che lavoro vorresti fare e perché?`,`Cosa conta di più per te: lo stipendio o la passione?`,`Andresti a lavorare all'estero?`,`Hai già avuto un'esperienza di lavoro?`,`Quali qualità servono per trovare lavoro oggi?`]},
{t:`La famiglia e le tradizioni`,doc:`In Italia la famiglia ha un ruolo centrale: i pranzi della domenica, le feste e le tradizioni riuniscono più generazioni. Oggi però i ritmi di vita e il lavoro rendono più difficile ritrovarsi.`,cons:`Présente le document et compare avec ta propre expérience en France.`,
qs:[`Com'è una domenica tipica nella tua famiglia?`,`Quali tradizioni sono importanti per te?`,`Perché oggi è più difficile passare del tempo insieme?`,`Cosa pensi del rapporto tra giovani e nonni?`,`Quali tradizioni vorresti conservare in futuro?`]},
{t:`Lo sport e la salute`,doc:`Secondo un rapporto recente, quasi la metà degli adolescenti italiani non pratica nessuno sport in modo regolare. Eppure i medici ricordano che muoversi ogni giorno fa bene al corpo e alla mente. Le scuole propongono corsi pomeridiani, ma non sempre i ragazzi hanno voglia di partecipare.`,cons:`Présente le document, explique le problème et donne ton avis sur les solutions possibles.`,
qs:[`Perché secondo te molti giovani non fanno sport?`,`Tu pratichi uno sport? Quali benefici ne trai?`,`La scuola dovrebbe rendere lo sport obbligatorio?`,`Meglio uno sport di squadra o individuale?`,`Come motivare chi non ha voglia?`]},
{t:`Il lavoro dei giovani`,doc:`In Italia molti giovani laureati trovano lavoro con difficoltà e spesso con contratti temporanei. Alcuni decidono di partire all'estero per cercare migliori opportunità, altri creano una piccola impresa. Il dibattito sul futuro dei giovani è sempre più acceso.`,cons:`Présente le document, dégage la problématique et exprime ton avis.`,
qs:[`Perché secondo te molti giovani lasciano il paese?`,`Quale lavoro ti piacerebbe fare e perché?`,`Lavorare mentre si studia è una buona idea?`,`Cosa dovrebbe fare lo Stato per aiutare i giovani?`,`Preferisci un lavoro sicuro o appassionante?`]},
{t:`Tradizioni e modernità`,doc:`Le feste tradizionali italiane, come il Carnevale o il Palio di Siena, attirano ogni anno migliaia di visitatori. Alcuni pensano che queste tradizioni siano un tesoro da proteggere, altri che rischino di diventare solo uno spettacolo per i turisti.`,cons:`Présente le document et discute de la place des traditions dans le monde moderne.`,
qs:[`Quali tradizioni sono importanti nella tua famiglia?`,`Il turismo aiuta o danneggia le tradizioni?`,`Perché è importante conservare il passato?`,`Le tradizioni devono cambiare con il tempo?`,`Qual è una tradizione del tuo paese che vorresti far conoscere?`]}
]

/* ---------- profils et stockage ---------- */
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const INT=[0,1,2,4,8,16,32];
let DB={cur:null,profiles:{}};
function normalize(p){
  p.name=p.name||'Moi';p.log=p.log||{};p.learned=p.learned||{};if(typeof p.goal!=='number')p.goal=10;
  p.done=p.done||{};p.srs=p.srs||{};p.stats=p.stats||{};p.lvl=p.lvl||{};p.reinforce=p.reinforce||{};
  p.course=COURSES[p.course]?p.course:'en';
  p.set=Object.assign({eng:'auto',voice:'buttery',rate:1,uk:false,force:false,bv:{}},p.set||{});
  p.bac=Object.assign({hist:[],seen:{}},p.bac||{});
  if(p.weak){for(const id in p.weak)if(!p.srs[id])p.srs[id]={b:0,d:today()};delete p.weak}
  return p;
}
function newProfile(name){
  const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  DB.profiles[id]=normalize({name:name});
  return id;
}
try{
  const raw=localStorage.getItem('apprendre-v2');
  if(raw){const d=JSON.parse(raw);if(d&&d.profiles)DB=d}
  else{
    const old=localStorage.getItem('apprendre-v1');
    if(old){const id='p'+Date.now().toString(36);DB.profiles[id]=normalize(Object.assign({name:'Moi'},JSON.parse(old)));DB.cur=id}
  }
}catch(e){}
for(const id in DB.profiles)normalize(DB.profiles[id]);
let store=null;
function save(){try{localStorage.setItem('apprendre-v2',JSON.stringify(DB))}catch(e){}}
let _lt=0,_ls=0;
function dayLog(){const d=today();return store.log[d]||(store.log[d]={s:0,n:0,ok:0})}
function _act(){
  if(!store)return;
  const n=Date.now();
  if(_lt&&n-_lt<90000)dayLog().s+=Math.round((n-_lt)/1000);
  _lt=n;
  if(n-_ls>15000){_ls=n;save()}
}
['pointerdown','keydown','input'].forEach(e=>document.addEventListener(e,_act,true));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&store)save()});
const minsToday=()=>store&&store.log[today()]?Math.round(store.log[today()].s/60):0;
function useProfile(id){DB.cur=id;store=normalize(DB.profiles[id]);save()}
let S=null;
const app=document.getElementById('app');

/* ---------- utilitaires ---------- */
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in attrs||{}){
    if(k==='class')e.className=attrs[k];
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  kids.flat(2).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c))});
  return e;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const norm=s=>s.toLowerCase().replace(/œ/g,'oe').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[¿?¡!.,;:"“”«»]/g,'').replace(/[’']/g,"'").replace(/\s+/g,' ').trim();
function accept(input,expected,c){
  const u=norm(input),e=norm(expected);
  return u===e||u===e.replace(c.art,'');
}
function similarity(a,b){
  const A=norm(a).split(' ').filter(Boolean),B=norm(b).split(' ').filter(Boolean);
  if(!A.length||!B.length)return 0;
  const dp=Array.from({length:A.length+1},()=>Array(B.length+1).fill(0));
  for(let i=1;i<=A.length;i++)for(let j=1;j<=B.length;j++)dp[i][j]=A[i-1]===B[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  return dp[A.length][B.length]/Math.max(A.length,B.length);
}
function bar(back,title){return h('div',{class:'bar'},h('button',{class:'x','aria-label':'Retour',onclick:back},'←'),title?h('b',{class:'bt'},title):null)}

let capTts=null,capDict=null,capSample=null,ttsOff=false,speakTok=0;
try{
  if(window.claude&&window.claude.use){
    window.claude.use('tts').then(t=>{capTts=t||null}).catch(()=>{});
    window.claude.use('dictation').then(d=>{capDict=d||null}).catch(()=>{});
    window.claude.use('sample').then(s=>{capSample=s||null}).catch(()=>{});
  }
}catch(e){}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canSpeak='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
if(canSpeak){try{speechSynthesis.getVoices()}catch(e){}}
const audioPossible=()=>!!(capTts&&!ttsOff)||canSpeak;
function hasVoice(lang){
  try{return canSpeak&&speechSynthesis.getVoices().some(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()))}catch(e){return false}
}
const audioOK=c=>!!(capTts&&!ttsOff)||hasVoice(c.lang)||store.set.force;
const micAvailable=()=>!!capDict||!!SR;
const langTag=c=>c.code==='en'&&store.set.uk?'en-GB':(c.code==='en'?'en-US':c.lang);
function pickVoice(c,lang){
  try{
    const vs=speechSynthesis.getVoices(),pref=store.set.bv[c.code];
    let v=pref&&vs.find(x=>x.voiceURI===pref);if(v)return v;
    v=vs.find(x=>x.lang.replace('_','-').toLowerCase()===lang.toLowerCase());
    return v||vs.find(x=>x.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()))||null;
  }catch(e){return null}
}
let audioErr='',lastToast=0;
function audioHelp(){
  if(['not-allowed','audio-busy'].includes(audioErr))return 'Le navigateur bloque le son. Touche directement un bouton 🔊, puis réessaie.';
  if(['no-start','absent','synthesis-unavailable','synthesis-failed','language-unavailable','voice-unavailable'].includes(audioErr))return 'Aucune voix de synthèse ne répond sur cet appareil. Installe une voix pour la langue dans les réglages du téléphone (accessibilité, synthèse vocale), vérifie le volume et le mode silencieux, puis fais ⚙ → Tester la voix.';
  return 'Le son n\'a pas démarré ('+(audioErr||'erreur')+'). Vérifie le volume et le mode silencieux.';
}
function toast(msg){
  const now=Date.now();if(now-lastToast<8000)return;lastToast=now;
  const t=h('div',{class:'toast'},msg);document.body.append(t);setTimeout(()=>t.remove(),9000);
}
function browserSpeak(text,c,rate,o){
  return new Promise(res=>{
    if(!canSpeak){audioErr='absent';res(false);return}
    try{
      const ss=speechSynthesis,busy=ss.speaking||ss.pending;
      if(busy)ss.cancel();
      try{ss.resume()}catch(e){}
      const u=new SpeechSynthesisUtterance(text),lang=langTag(c);
      u.lang=lang;u.rate=Math.min(1.5,Math.max(.4,.9*rate));if(o&&o.pitch)u.pitch=o.pitch;
      const v=pickVoice(c,lang);if(v)u.voice=v;
      let done=false,started=false,t,st;
      const fin=ok=>{if(!done){done=true;clearTimeout(t);clearTimeout(st);res(ok)}};
      u.onstart=()=>{started=true;clearTimeout(st)};
      u.onend=()=>{audioErr='';fin(true)};
      u.onerror=e=>{const er=(e&&e.error)||'erreur';if(er==='canceled'||er==='interrupted'){fin(false);return}audioErr=er;fin(false)};
      st=setTimeout(()=>{if(!started){audioErr='no-start';try{ss.cancel()}catch(e){}fin(false)}},4000);
      t=setTimeout(()=>fin(true),Math.max(3000,text.length*170/Math.max(.5,rate)+1500));
      const go=()=>{try{ss.speak(u)}catch(e){audioErr='erreur';fin(false)}};
      if(busy)setTimeout(go,150);else go();
    }catch(e){audioErr='erreur';res(false)}
  });
}
async function speakAsync(text,c,o){
  o=o||{};
  const rate=(o.rate||1)*(store.set.rate||1);
  const my=++speakTok;
  if(capTts&&!ttsOff&&store.set.eng!=='browser'){
    try{
      await capTts.speak(text,{language:c.code==='en'&&store.set.uk?'en-GB':c.code,rate:Math.min(1.5,Math.max(.7,rate)),voice:o.voice||store.set.voice});
      return my===speakTok||true;
    }catch(e){
      const code=e&&e.code;
      if(code==='not_granted'){ttsOff=true;return false}
      if(code==='stopped'||code==='busy'||code==='no_gesture')return false;
    }
  }
  return browserSpeak(text,c,rate,o);
}
function stopSpeak(){
  speakTok++;
  try{if(capTts)capTts.stop().catch(()=>{})}catch(e){}
  try{if(canSpeak)speechSynthesis.cancel()}catch(e){}
}
function say(text,rate,c){speakAsync(text,c||CC(),{rate}).then(ok=>{if(ok===false&&audioErr)toast(audioHelp())}).catch(()=>{})}
function speakBtn(text,c){
  if(!audioPossible())return null;
  return h('div',{class:'spkgrp'},
    h('button',{class:'spk','aria-label':'Écouter',onclick:()=>say(text,1,c)},'🔊'),
    h('button',{class:'spk','aria-label':'Écouter lentement',onclick:()=>say(text,.7,c)},'🐢'));
}

/* ---------- reconnaissance vocale (dictée Claude, sinon navigateur) ---------- */
function recognizeStart(c,cb){
  let finished=false;const unsubs=[];
  const fin=(text,reason)=>{if(finished)return;finished=true;unsubs.forEach(f=>{try{f()}catch(e){}});cb.end(text,reason)};
  if(capDict){
    let buf='';
    try{
      unsubs.push(capDict.onPartial(e=>cb.partial&&cb.partial((buf+' '+(e.text||'')).trim())));
      unsubs.push(capDict.onFinal(e=>{buf+=e.text||'';cb.partial&&cb.partial(buf.trim())}));
      unsubs.push(capDict.onState(e=>{if(e.state==='idle')setTimeout(()=>fin(buf.trim(),e.reason||'stopped'),350)}));
      capDict.start({language:c.code}).catch(err=>fin('',(err&&err.code)||'upstream_error'));
    }catch(e){fin('','unavailable')}
    return {stop:()=>{try{capDict.stop().catch(()=>{})}catch(e){}}};
  }
  if(SR){
    try{
      const r=new SR();r.lang=c.lang;r.interimResults=true;r.maxAlternatives=1;let buf='';
      r.onresult=ev=>{let t='';for(let i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript+' ';buf=t.trim();cb.partial&&cb.partial(buf)};
      r.onerror=ev=>fin(buf,(ev&&ev.error)||'upstream_error');
      r.onend=()=>fin(buf,'ended');
      r.start();
      return {stop:()=>{try{r.stop()}catch(e){}}};
    }catch(e){fin('','unavailable')}
  }
  fin('','unavailable');
  return {stop(){}};
}
const MIC_FATAL=['not_granted','unavailable','not-allowed','service-not-allowed','upstream_error','rate_limited','audio-capture','dismissed'];
/* bouton micro réutilisable : accumule une transcription ; onText(texte) à chaque mise à jour */
function micWidget(c,onText){
  let rec=null,busy=false,base='',cur='';
  const out=h('div',{class:'heard'},'');
  const btn=h('button',{class:'mic'},'🎤 Parler');
  const msg=h('div',{class:'sub'},'');
  function setBusy(b){busy=b;btn.classList.toggle('on',b);btn.textContent=b?'🎙️ J\'écoute… touche pour finir':'🎤 Parler'}
  btn.addEventListener('click',()=>{
    if(busy){if(rec)rec.stop();return}
    stopSpeak();msg.textContent='';setBusy(true);
    rec=recognizeStart(c,{
      partial:t=>{cur=t;out.textContent='« '+(base?base+' ':'')+t+' »'},
      end:(text,reason)=>{
        setBusy(false);
        if(text){base=(base?base+' ':'')+text;cur='';out.textContent='« '+base+' »';onText(base)}
        else if(MIC_FATAL.includes(reason)){msg.textContent='Le micro n\'est pas disponible ici ('+reason+'). Parle à voix haute et note-toi toi-même.';btn.disabled=true;onText(base,true)}
        else msg.textContent='Je n\'ai rien entendu. Réessaie.';
      }});
  });
  return {el:h('div',{class:'micbox'},btn,out,msg),text:()=>base,reset:()=>{base='';out.textContent=''}};
}

  }
}

/* ---------- parcours adaptatif ---------- */
const allItems=ci=>COURSES[ci].units.flatMap(u=>u.i);
const dueItems=ci=>allItems(ci).filter(x=>store.srs[x.id]&&store.srs[x.id].d<=today()).sort((a,b)=>store.srs[a.id].b-store.srs[b.id].b);
const unitItems=(ci,ui)=>COURSES[ci].units[ui].i;
const mastery=(ci,ui)=>{const it=unitItems(ci,ui);return Math.round(100*it.filter(x=>store.srs[x.id]&&store.srs[x.id].b>=3).length/it.length)};
const started=(ci,ui)=>unitItems(ci,ui).some(x=>store.srs[x.id]);
const diffOf=id=>{const s=store.stats[id];return s?(s.ko+.5)/(s.ok+s.ko+1):0};
const weakList=ci=>allItems(ci).filter(x=>{
  const s=store.stats[x.id];if(!s||s.ko<1)return false;
  const b=store.srs[x.id]?store.srs[x.id].b:0;
  return b<=2&&(s.ko>=2||s.ko>=s.ok*.5);
}).sort((a,b)=>diffOf(b.id)-diffOf(a.id));
function levelLabel(ci,ui){const c=COURSES[ci];let l='';(c.levels||[]).forEach(x=>{if(x[0]<=ui)l=x[1]});return l}
function nextStep(ci){
  const c=COURSES[ci],w=weakList(ci).length,due=dueItems(ci).length;
  const re=c.units.findIndex((u,ui)=>store.reinforce[ci+':'+ui]);
  if(w>=4)return{t:'Rattrapage : '+w+' mots difficiles',s:'Reprendre exactement là où tu as eu du mal',f:()=>startLesson('weak')};
  if(re>=0)return{t:'À renforcer : '+c.units[re].t,s:'Dernier score '+store.reinforce[ci+':'+re]+' %',f:()=>vocabScreen(re,true)};
  if(due>=5)return{t:'Révision du jour',s:due+' mots à revoir',f:()=>startLesson('review')};
  const lv=store.lvl[ci]||0;
  let ui=c.units.findIndex((u,i)=>i>=lv&&store.done[ci+':'+i]==null);
  if(ui<0)ui=c.units.findIndex((u,i)=>store.done[ci+':'+i]==null);
  if(ui>=0)return{t:'Continuer : '+c.units[ui].t,s:'Unité '+(ui+1)+' sur '+c.units.length,f:()=>vocabScreen(ui,true)};
  return{t:'Parcours terminé',s:'Continue avec les révisions et les points faibles',f:()=>startLesson(due?'review':'weak')};
}

/* ---------- test de niveau ---------- */
function placementScreen(){
  const ci=store.course,c=COURSES[ci],n=c.units.length;
  const steps=Math.min(12,n),qs=[];
  for(let k=0;k<steps;k++){
    const ui=steps>1?Math.round(k*(n-1)/(steps-1)):0;
    const u=c.units[ui];
    qs.push({ui,u,it:u.i[Math.floor(Math.random()*u.i.length)],tf:Math.random()<.5});
  }
  const res=[];let i=0;
  function finish(){
    let lastOk=-1;res.forEach((r,k)=>{if(r.ok)lastOk=qs[k].ui});
    const bad=res.filter(r=>!r.ok).length;
    const level=(res.length===qs.length&&bad<=1)?n-1:(lastOk<0?0:Math.min(n-1,lastOk+1));
    store.lvl[ci]=level;save();
    app.replaceChildren(
      h('div',{class:'stage res'},h('h2',{},'Test terminé'),
        h('p',{class:'sub'},'Ton niveau de départ'),
        h('div',{class:'big small'},'Unité '+(level+1)),
        h('p',{class:'sub'},c.units[level].t+(levelLabel(ci,level)?' · '+levelLabel(ci,level):'')),
        h('p',{class:'note'},level>0?'Les unités précédentes sont marquées comme acquises. Elles restent disponibles, et les mots que tu rates en route reviendront automatiquement.':'Tu commences au début : l\'appli adaptera ensuite le rythme à tes réponses.')),
      h('div',{class:'foot'},h('button',{class:'btn wide',onclick:homeScreen},'Commencer'))
    );
  }
  function show(){
    if(i>=qs.length){finish();return}
    const q=qs[i],it=q.it,tf=q.tf;
    const ans=tf?it.f:it.t;
    const others=[...new Set(q.u.i.filter(x=>x!==it).map(x=>tf?x.f:x.t).filter(x=>x!==ans))];
    const opts=shuffle([ans,...shuffle(others).slice(0,3)]);
    let locked=false;
    const wrap=h('div',{class:'opts'});
    const answer=(ok,btn)=>{
      if(locked)return;locked=true;
      [...wrap.children].forEach(b=>{b.disabled=true;if(b.textContent===ans)b.classList.add('good')});
      if(!ok&&btn)btn.classList.add('wrong');
      res.push({ok});
      const stop=res.length>=2&&!res[res.length-1].ok&&!res[res.length-2].ok;
      setTimeout(()=>{if(stop)finish();else{i++;show()}},650);
    };
    opts.forEach(o=>{const b=h('button',{class:'opt'},o);b.addEventListener('click',()=>answer(o===ans,b));wrap.append(b)});
    const idk=h('button',{class:'link',onclick:()=>answer(false,null)},'Je ne sais pas');
    app.replaceChildren(
      h('div',{class:'bar'},h('button',{class:'x','aria-label':'Quitter',onclick:homeScreen},'×'),h('div',{class:'prog'},h('i',{style:'width:'+Math.round(i/qs.length*100)+'%'}))),
      h('div',{class:'stage'},
        h('p',{class:'ask'},'Test de niveau · '+c.name+' · '+(tf?'traduis en français':'traduis en '+c.name.toLowerCase())),
        h('div',{class:'prompt'},tf?it.t:it.f),
        wrap,idk)
    );
  }
  app.replaceChildren(
    bar(homeScreen,'Test de niveau'),
    h('div',{class:'stage'},
      h('h2',{},'Trouvons ton niveau'),
      h('p',{class:'note'},'Une douzaine de questions de plus en plus difficiles, sans pression. Réponds « Je ne sais pas » quand tu hésites : le test s\'arrête dès que ça devient trop dur et te place au bon endroit.'),
      h('button',{class:'btn wide',onclick:show},'Commencer le test'))
  );
}

function backupSection(){
  const out=h('textarea',{class:'ta',rows:'4',readonly:'',placeholder:'Le code de sauvegarde apparaîtra ici'});
  const inp=h('textarea',{class:'ta',rows:'3',placeholder:'Colle ici un code de sauvegarde'});

  let delArmed=false;
  const enc=()=>'APPR1:'+btoa(unescape(encodeURIComponent(JSON.stringify(DB))));
  return h('div',{class:'set'},
    h('b',{},'Profils et sauvegarde'),
    h('span',{class:'sub'},'Profil actuel : '+store.name),
    h('button',{class:'btn ghost',onclick:profilesScreen},'👤 Changer ou créer un profil'),

      out.value=enc();msg.textContent='Garde ce code (note, message à toi-même) : il contient tous les profils et leur progression.';

    }},'💾 Exporter la progression'),
    out,inp,
    h('button',{class:'btn ghost',onclick:()=>{

        let n=0;for(const id in d.profiles){DB.profiles[id]=normalize(d.profiles[id]);n++}
        if(DB.cur&&DB.profiles[DB.cur])store=DB.profiles[DB.cur];

        setTimeout(profilesScreen,900);

    }},'📥 Importer un code'),
    msg,
    h('button',{class:'link',onclick:e=>{

    }},'Supprimer ce profil'));
}

/* ---------- écoute continue ---------- */
function listenScreen(ui){
  const c=CC(),u=c.units[ui],items=u.i;
  const o={pause:true,fr:true,loop:false,hide:false};
  let run=0,idx=0,playing=false,fails=0;
  const rows=items.map((it,i)=>h('div',{class:'vrow lrow',onclick:()=>{idx=i;mark();if(playing)start()}},h('div',{},h('b',{class:'tt'},it.t),h('span',{class:'ff'},it.f))));
  const status=h('div',{class:'sub center'},'Écoute, répète à voix haute pendant la pause, puis la traduction est lue.');
  const playBtn=h('button',{class:'btn',onclick:()=>playing?pause():start()},'▶ Lecture');
  function mark(){rows.forEach((r,i)=>r.classList.toggle('hl',i===idx));const r=rows[idx];if(r&&r.scrollIntoView)try{r.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}}
  function pause(){run++;playing=false;stopSpeak();playBtn.textContent='▶ Lecture';status.textContent='En pause.'}
  async function start(){
    const my=++run;playing=true;playBtn.textContent='⏸ Pause';fails=0;
    while(playing&&my===run){
      const it=items[idx];mark();status.textContent='Écoute…';
      const ok=await speakAsync(it.t,c);
      if(my!==run)return;
      if(!ok){fails++;if(fails>=3){playing=false;playBtn.textContent='▶ Lecture';status.textContent='Audio indisponible ici. Vérifie les réglages (⚙).';return}}else fails=0;
      if(o.pause){status.textContent='À toi : répète à voix haute…';await sleep(Math.max(1500,it.t.length*100));if(my!==run)return}
      if(o.fr){status.textContent='Traduction…';await speakAsync(it.f,FR);if(my!==run)return}
      await sleep(350);if(my!==run)return;
      idx++;if(idx>=items.length){if(o.loop)idx=0;else{idx=0;playing=false;playBtn.textContent='▶ Lecture';status.textContent='Terminé. Recommence quand tu veux.';mark();return}}
    }
  }
  const tog=(label,k,cb)=>h('label',{class:'tg'},h('input',{type:'checkbox',...(o[k]?{checked:''}:{}),onchange:e=>{o[k]=e.target.checked;if(cb)cb()}}),h('span',{},label));
  const list=h('div',{class:'vocab'},rows);
  app.replaceChildren(
    bar(()=>{run++;stopSpeak();homeScreen()},'Écoute · '+u.t),
    h('div',{class:'stage scroll'},
      status,
      h('div',{class:'row'},
        h('button',{class:'btn ghost',onclick:()=>{idx=Math.max(0,idx-1);mark();if(playing)start()}},'⏮'),
        playBtn,
        h('button',{class:'btn ghost',onclick:()=>{idx=Math.min(items.length-1,idx+1);mark();if(playing)start()}},'⏭')),
      h('div',{class:'togs'},
        tog('Pause pour répéter','pause'),tog('Lire la traduction','fr'),tog('Boucle','loop'),
        tog('Masquer le texte','hide',()=>list.classList.toggle('mask',o.hide))),
      list)
  );
  mark();
}

function dialogScreen(di){
  const c=CC(),d=DIALOGS[c.code][di];
  const st={mode:'idle',pos:-1,fr:true,hide:false,wait:false};
  let run=0,resolveNext=null;
  const voiceOf=s=>s==='A'?{voice:'buttery',pitch:1}:{voice:'airy',pitch:1.25};
  const lines=h('div',{class:'dlg'});
  const panel=h('div',{class:'dpanel'});
  function drawLines(){
    lines.replaceChildren(...d.l.map((ln,i)=>{
      const mine=st.mode==='A'||st.mode==='B'?ln.s===st.mode:false;
      const hidden=mine&&st.hide&&!(i<st.pos);
      return h('div',{class:'bub '+ln.s+(i===st.pos?' hl':'')},
        h('span',{class:'who'},ln.s),
        h('div',{},h('b',{class:'tt'},hidden?'••• (à toi de la dire)':ln.t),st.fr?h('span',{class:'ff'},ln.f):null),
        speakBtn(ln.t,c));
    }));
  }
  function stop(){run++;stopSpeak();st.mode='idle';st.wait=false;if(resolveNext){resolveNext();resolveNext=null}}
  async function listenAll(){
    stop();const my=++run;st.mode='listen';
    for(let i=0;i<d.l.length&&my===run;i++){st.pos=i;drawLines();drawPanel();await speakAsync(d.l[i].t,c,voiceOf(d.l[i].s));if(my!==run)return;await sleep(350)}
    if(my===run){st.mode='idle';st.pos=-1;drawLines();drawPanel()}
  }
  async function role(r){
    stop();const my=++run;st.mode=r;
    for(let i=0;i<d.l.length&&my===run;i++){
      st.pos=i;st.wait=false;drawLines();
      if(d.l[i].s!==r){drawPanel('Je dis : '+d.l[i].f);await speakAsync(d.l[i].t,c,voiceOf(d.l[i].s));if(my!==run)return;await sleep(300)}
      else{st.wait=true;drawPanel();await new Promise(res=>{resolveNext=res});resolveNext=null;if(my!==run)return}
    }
    if(my===run){st.mode='done';st.pos=d.l.length;st.wait=false;drawLines();drawPanel()}
  }
  function drawPanel(info){
    panel.replaceChildren();
    if(st.mode==='idle'||st.mode==='done'){
      panel.append(h('div',{class:'row wrap'},
        h('button',{class:'btn',onclick:listenAll},'▶ Écouter le dialogue'),
        h('button',{class:'btn ghost',onclick:()=>role('A')},'Jouer le rôle A'),
        h('button',{class:'btn ghost',onclick:()=>role('B')},'Jouer le rôle B')),
        st.mode==='done'?h('p',{class:'sub center'},'Dialogue terminé. Refais-le sans le texte pour t\'entraîner de mémoire.'):null);
      return;
    }
    if(st.mode==='listen'){panel.append(h('button',{class:'btn ghost wide',onclick:()=>{stop();drawPanel();drawLines()}},'■ Arrêter'));return}
    if(st.wait){
      const ln=d.l[st.pos];
      const w=micAvailable()?micWidget(c,(t)=>{const s=similarity(t,ln.t);sc.textContent=t?'Proximité avec la réplique : '+Math.round(s*100)+' %':''}):null;
      const sc=h('div',{class:'sub center'},'');
      panel.append(h('b',{},'À toi de dire cette réplique'),h('p',{class:'sub'},ln.f),w?w.el:h('p',{class:'sub'},'Dis-la à voix haute.'),sc,
        h('div',{class:'row wrap'},h('button',{class:'btn',onclick:()=>{if(resolveNext){const r=resolveNext;resolveNext=null;r()}}},'Réplique suivante →'),h('button',{class:'btn ghost',onclick:stop},'■ Arrêter')));
      return;
    }
    panel.append(h('p',{class:'sub center'},info||'L\'autre personne parle…'),h('button',{class:'btn ghost wide',onclick:()=>{stop();drawPanel();drawLines()}},'■ Arrêter'));
  }
  const tog=(label,k)=>h('label',{class:'tg'},h('input',{type:'checkbox',...(st[k]?{checked:''}:{}),onchange:e=>{st[k]=e.target.checked;drawLines()}}),h('span',{},label));
  app.replaceChildren(
    bar(()=>{stop();dialogListScreen()},d.t),
    h('div',{class:'stage scroll'},h('p',{class:'sub'},d.sc),h('div',{class:'togs'},tog('Traduction','fr'),tog('Cacher mes répliques','hide')),lines,panel)
  );
  drawLines();drawPanel();
}

/* ---------- moteur de leçon ---------- */
function startLesson(mode,ui){
  const ci=store.course,c=COURSES[ci];
  let items,pool;
  if(mode==='review'){items=shuffle(dueItems(ci).slice(0,10));pool=allItems(ci)}
  else if(mode==='weak'){items=shuffle(weakList(ci).slice(0,10));pool=allItems(ci)}
  else{
    const base=c.units[ui].i;
    const extra=weakList(ci).filter(x=>!base.includes(x)).slice(0,3);
    items=base.concat(extra);pool=base.concat(extra);
  }
  if(!items.length){homeScreen();return}
  if(pool.length<4)pool=allItems(ci);
  const q=[];
  shuffle(items).forEach(it=>q.push({type:'mc',item:it,dir:Math.random()<.5?'tf':'ft'}));
  if(items.length>=5)q.push({type:'match',items:shuffle(items).slice(0,5)});
  shuffle(items.filter(it=>it.t.split(/\s+/).length>=4)).slice(0,2).forEach(it=>q.push({type:'cloze',item:it}));
  shuffle(items).forEach(it=>q.push({type:it.t.split(/\s+/).length>=3?'build':'type',item:it}));
  items.filter(it=>(store.stats[it.id]||{ko:0}).ko>=2).slice(0,3).forEach(it=>q.push({type:'type',item:it}));
  const aud=audioOK(c),sh=shuffle(items);
  if(aud){
    sh.slice(0,2).forEach(it=>q.push({type:'listen',item:it}));
    sh.slice(2,4).forEach(it=>q.push({type:'listenfr',item:it}));
    sh.slice(4,6).forEach(it=>q.push({type:'dictation',item:it}));
  }
  if(aud||micAvailable()){
    const multi=shuffle(items.filter(it=>it.t.split(/\s+/).length>=2));
    (multi.length>=3?multi:sh).slice(0,3).forEach(it=>q.push({type:'speak',item:it}));
  }
  S={mode,ui,course:c,items,pool,q,i:0,first:0,miss:0,initial:q.length,missed:new Map(),err:{}};
  lessonScreen();
}
function lessonScreen(){
  const ex=S.q[S.i];
  if(!ex){resultScreen();return}
  stopSpeak();
  const bar_=h('div',{class:'bar'},
    h('button',{class:'x','aria-label':'Quitter',onclick:homeScreen},'×'),
    h('div',{class:'prog'},h('i',{style:'width:'+Math.round(S.i/S.q.length*100)+'%'})));
  const stage=h('div',{class:'stage'}),foot=h('div',{class:'foot'});
  app.replaceChildren(bar_,stage,foot);
  EX[ex.type](ex,stage,foot);
  window.scrollTo(0,0);
}
function nextBtn(){return h('button',{class:'btn wide',onclick:()=>{S.i++;lessonScreen()}},'Continuer')}
function bump(it,ok){const s=store.stats[it.id]||(store.stats[it.id]={ok:0,ko:0});const L=dayLog();L.n++;if(ok){s.ok++;L.ok++}else{s.ko++;s.miss=(s.miss||0)+1}}
function resolve(ex,ok,foot,extra){
  const it=ex.item;
  bump(it,ok);
  if(ok){if(!ex.retry)S.first++}
  else{
    S.miss++;S.missed.set(it.id,it);
    S.err[it.id]=(S.err[it.id]||0)+1;
    const pos=Math.min(S.i+4,S.q.length),copy=Object.assign({},ex,{retry:true});
    const n=S.err[it.id];
    if(n<=4){if(n>=2&&n%2===0)S.q.splice(pos,0,{type:'teach',item:it},copy);else S.q.splice(pos,0,copy)}
  }
  save();
  foot.className='foot '+(ok?'ok':'bad');
  foot.replaceChildren(
    h('div',{class:'msg'},h('b',{},ok?'Correct !':'Pas tout à fait'),h('span',{},it.t+'  =  '+it.f),extra?h('span',{class:'ex'},extra):null),
    nextBtn());
  say(it.t,1,S.course);
}
function skipListening(){
  const keep=[],removed=[];
  S.q.forEach((e,idx)=>{if(idx===S.i||(idx>S.i&&(e.type==='listen'||e.type==='listenfr'||e.type==='dictation')))removed.push(e);else keep.push(e)});
  S.initial-=removed.filter(e=>!e.retry).length;
  S.q=keep;
  lessonScreen();
}
function skipCurrent(){
  const ex=S.q[S.i];
  if(!ex.retry)S.initial--;
  S.q.splice(S.i,1);
  lessonScreen();
}
function optsEl(opts,correct,ex,foot){
  let locked=false;
  const wrap=h('div',{class:'opts'});
  opts.forEach(o=>{
    const b=h('button',{class:'opt'},o);
    b.addEventListener('click',()=>{
      if(locked)return;locked=true;
      const ok=o===correct;
      b.classList.add(ok?'good':'wrong');
      if(!ok){const r=[...wrap.children].find(x=>x.textContent===correct);if(r)r.classList.add('good')}
      [...wrap.children].forEach(x=>x.disabled=true);
      resolve(ex,ok,foot);
    });
    wrap.append(b);
  });
  return wrap;
}
function textExercise(ex,stage,foot,ask,promptEl,extraEl){
  const it=ex.item,c=S.course;
  let done=false;
  const inp=h('input',{type:'text',class:'txt',autocomplete:'off',autocapitalize:'off',autocorrect:'off',spellcheck:'false',placeholder:'Ta réponse'});
  const btn=h('button',{class:'btn wide',disabled:'',onclick:check},'Vérifier');
  inp.addEventListener('input',()=>{btn.disabled=!inp.value.trim()});
  inp.addEventListener('keydown',e=>{

  });

  stage.append(h('p',{class:'ask'},ask),promptEl,inp,chars,extraEl);

}

    const chosen=[];let done=false;
    const ans=h('div',{class:'ans'}),bank=h('div',{class:'bank'});
    const btn=h('button',{class:'btn wide',disabled:'',onclick:check},'Vérifier');
    function draw(){

      bank.replaceChildren(...order.map(i=>chosen.includes(i)?h('span',{class:'tile ghostt'},words[i]):h('button',{class:'tile',onclick:()=>{if(done)return;chosen.push(i);draw()}},words[i])));

  },
  cloze(ex,stage,foot){
    const it=ex.item,toks=it.t.split(' ');
    const core=w=>w.replace(/^[¿¡"]+|[.,?!"]+$/g,'');
    const isCap=w=>/^[A-ZÁÉÍÓÚÑÀÈÌÒÙ]/.test(w);
    const cand=toks.map((w,i)=>i).filter(i=>i>0&&core(toks[i]).length>=4);
    if(!cand.length)return EX.type(ex,stage,foot);

    const ans=core(toks[bi]);
    const words=[];
    S.pool.forEach(x=>x.t.split(' ').forEach((w,i)=>{const c=core(w);if(i>0&&c.length>=3&&c.toLowerCase()!==ans.toLowerCase()&&isCap(c)===isCap(ans))words.push(c)}));
    const dist=shuffle([...new Set(words)]).slice(0,3);
    if(dist.length<2)return EX.type(ex,stage,foot);
    const sentence=toks.map((w,i)=>i===bi?w.replace(ans,'_____'):w).join(' ');
    stage.append(
      h('p',{class:'ask'},'Complète la phrase'),

  match(ex,stage,foot){

    shuffle(its).forEach(it=>{const b=h('button',{class:'opt sm'},it.f);b._it=it;b.addEventListener('click',()=>pick(b,'r'));wrapR.append(b)});
    stage.append(h('p',{class:'ask'},'Associe chaque mot à sa traduction : touche d\'abord à gauche, puis à droite.'),h('div',{class:'cols'},wrapL,wrapR));

  listen(ex,stage,foot){

function pickSubject(kind){
  const n=BAC[kind].length;let seen=store.bac.seen[kind]||[];
  let avail=[...Array(n).keys()].filter(i=>!seen.includes(i));
  if(!avail.length){seen=[];avail=[...Array(n).keys()]}
  const i=avail[Math.floor(Math.random()*avail.length)];
  seen.push(i);store.bac.seen[kind]=seen;save();
  return i;
}

function qcmBlock(qs){

  let onChange=()=>{};
  const upd=()=>onChange(state.every(s=>s.pick>=0));
  const els=state.map((s,qi)=>{
    const wrap=h('div',{class:'opts'});
    s.btns=s.opts.map((o,oi)=>{const b=h('button',{class:'opt',onclick:()=>{if(s.locked)return;s.pick=oi;s.btns.forEach((x,k)=>x.classList.toggle('sel',k===oi));upd()}},o.t);wrap.append(b);return b});
    return h('div',{class:'qb'},h('b',{},(qi+1)+'. '+qs[qi].q),wrap);
  });
  return {el:h('div',{},els),setOnChange:f=>{onChange=f},
    reveal(){state.forEach(s=>{s.locked=true;s.btns.forEach((b,k)=>{b.disabled=true;b.classList.remove('sel');if(s.opts[k].ok)b.classList.add('good');else if(k===s.pick)b.classList.add('wrong')})});return state.filter(s=>s.pick>=0&&s.opts[s.pick].ok).length}};

function gridEl(crit,max){
  const vals=crit.map(()=>Math.round(max*.6));
  const outs=crit.map((c,i)=>h('b',{},vals[i]+' / '+max));
  const el=h('div',{class:'grid'},crit.map((c,i)=>h('label',{class:'set'},h('span',{},c+' '),outs[i],h('input',{type:'range',min:'0',max:String(max),step:'1',value:String(vals[i]),oninput:e=>{vals[i]=parseInt(e.target.value,10);outs[i].textContent=vals[i]+' / '+max;tot.textContent='Total : '+total()+' / '+(max*crit.length)}}))));
  const total=()=>vals.reduce((a,b)=>a+b,0);
  const tot=h('b',{class:'center'},'Total : '+total()+' / '+(max*crit.length));
  return {el:h('div',{},el,tot),total,set:(arr)=>{arr.forEach((v,i)=>{v=Math.max(0,Math.min(max,Math.round(Number(v)||0)));vals[i]=v;const inp=el.querySelectorAll('input')[i];inp.value=String(v);outs[i].textContent=v+' / '+max});tot.textContent='Total : '+total()+' / '+(max*crit.length)}};
}
const VOICE_AB=s=>s==='A'?{voice:'buttery',pitch:1}:{voice:'airy',pitch:1.25};
function coScreen(item,fin,title){
  const MAX=3;let plays=0,playing=false,run=0;
  const btn=h('button',{class:'btn wide'},'▶ Écouter le document ('+MAX+' écoutes)');
  const status=h('div',{class:'sub center'},'Écoute attentivement, puis réponds aux questions.');
  const script=h('div',{class:'script hidden'},item.script.map(l=>h('p',{},(item.script.length>1?l[0]+' : ':'')+l[1])));
  const q=qcmBlock(item.qs);
  const submit=h('button',{class:'btn wide',disabled:''},'Valider mes réponses');
  if(!audioPossible()){status.textContent='Audio indisponible ici : lis la transcription ci-dessous (entraînement CE).';script.classList.remove('hidden');btn.disabled=true}
  btn.addEventListener('click',async()=>{
    if(playing){run++;stopSpeak();playing=false;btn.textContent='▶ Écouter le document ('+(MAX-plays)+' restantes)';return}
    if(plays>=MAX)return;
    plays++;playing=true;const my=++run;btn.textContent='■ Arrêter';status.textContent='Écoute '+plays+' / '+MAX;
    for(let i=0;i<item.script.length&&my===run;i++){await speakAsync(item.script[i][1],IT,VOICE_AB(item.script[i][0]));if(my!==run)return;await sleep(400)}
    if(my===run){playing=false;btn.textContent=plays>=MAX?'Écoutes terminées':'▶ Réécouter ('+(MAX-plays)+' restantes)';btn.disabled=plays>=MAX;status.textContent=plays>=MAX?'Réponds maintenant aux questions.':'Tu peux réécouter.'}
  });
  q.setOnChange(ok=>{submit.disabled=!ok});
  submit.addEventListener('click',()=>{
    run++;stopSpeak();
    const good=q.reveal(),score=Math.round(good/item.qs.length*20);
    script.classList.remove('hidden');submit.replaceWith(h('div',{class:'resbox'},h('b',{},good+' / '+item.qs.length+' bonnes réponses · '+score+' / 20'),h('button',{class:'btn wide',onclick:()=>fin(score,{good})},B.pi+1<B.parts.length?'Partie suivante →':'Terminer')));
  });
  app.replaceChildren(bar(()=>{run++;stopSpeak();bacScreen()},title),
    h('div',{class:'stage scroll'},h('h2',{},item.t),h('p',{class:'sub'},'Niveau '+item.niv+' · questions en français'),btn,status,q.el,submit,h('h3',{class:'lvl'},'Transcription'),script));
}

  const tm=timerEl(25*60);

    const good=q.reveal(),score=Math.round(good/item.qs.length*20);
    submit.replaceWith(h('div',{class:'resbox'},h('b',{},good+' / '+item.qs.length+' bonnes réponses · '+score+' / 20'),h('button',{class:'btn wide',onclick:()=>fin(score,{good})},B.pi+1<B.parts.length?'Partie suivante →':'Terminer')));
  });
  app.replaceChildren(bar(()=>{tm.stop();bacScreen()},title),
    h('div',{class:'stage scroll'},h('div',{class:'row between'},h('h2',{},item.t),tm.el),h('p',{class:'sub'},'Niveau '+item.niv+' · temps conseillé : 25 min'),
      h('div',{class:'text'},item.text.split('\n\n').map(p=>h('p',{},p),audioPossible()?null:null)),
