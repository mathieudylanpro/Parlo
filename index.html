      q.el,submit));
}
const CONN_RE=/\b(prima di tutto|innanzitutto|inoltre|tuttavia|infatti|per esempio|da una parte|dall'altra|secondo me|a mio avviso|quindi|dunque|in conclusione|per concludere|però|perché|poi|alla fine|ad un tratto|invece|anche se|mentre|quando)\b/gi;
function connCount(t){const m=(t.match(CONN_RE)||[]).map(x=>x.toLowerCase());return [...new Set(m)]}
function eeScreen(item,fin,title){
  const tm=timerEl(45*60);
  const ta=h('textarea',{class:'ta',rows:'12',placeholder:'Écris ta production en italien…',spellcheck:'false',autocapitalize:'sentences'});
  const wc=h('div',{class:'sub'},'');
  const nWords=()=>ta.value.trim()?ta.value.trim().split(/\s+/).length:0;
  const count=()=>{const n=nWords();wc.textContent=n+' mots (objectif : '+item.min+' à '+item.max+')';wc.className='sub '+(n>=item.min&&n<=item.max?'okc':n>item.max?'warn':'')};
  ta.addEventListener('input',count);count();
  const chars=h('div',{class:'chars'},IT.chars.map(ch=>h('button',{onclick:()=>{ta.value+=ch;ta.dispatchEvent(new Event('input'));ta.focus()}},ch)));
  const aide=h('details',{},h('summary',{},'Aide : structures et connecteurs'),h('ul',{},item.aide.concat(CONN).map(x=>h('li',{},x))));
  const done=h('button',{class:'btn wide',onclick:review},'Terminer et corriger');
  const root=h('div',{class:'stage scroll'},
    h('div',{class:'row between'},h('h2',{},item.t),tm.el),
    h('div',{class:'note'},h('b',{},'Sujet. '),item.cons,h('p',{class:'tt'},item.it)),
    aide,ta,chars,wc,done);
  app.replaceChildren(bar(()=>{tm.stop();bacScreen()},title),root);
  function review(){
    tm.stop();ta.readOnly=true;chars.remove();done.remove();
    const n=nWords(),cn=connCount(ta.value);
    const fbBox=h('div',{class:'fbbox'},'');
    const grid=gridEl(['Réalisation de la tâche','Cohérence et organisation','Lexique','Grammaire et orthographe'],5);
    const askBtn=capSample?h('button',{class:'btn wide ghost',onclick:async()=>{
      askBtn.disabled=true;
      const prompt='Tu es examinateur de langue italienne au baccalauréat français (niveau B1). Corrige la production écrite d\'un élève.\nSujet (italien) : '+item.it+'\nSujet (français) : '+item.cons+'\nLongueur attendue : '+item.min+' à '+item.max+' mots.\nProduction de l\'élève :\n"""\n'+ta.value+'\n"""\nRéponds uniquement par un JSON de la forme {"note_sur_20":number,"criteres":{"tache":0-5,"coherence":0-5,"lexique":0-5,"grammaire":0-5},"points_forts":["..."],"erreurs":[{"extrait":"...","correction":"...","explication":"... en français"}],"version_amelioree":"texte italien corrigé","conseils":["..."]}. Maximum 8 erreurs, les plus importantes. Explications bienveillantes et en français.';
      const r=await askClaude(prompt,fbBox);
      askBtn.disabled=false;
      if(r){renderFeedback(fbBox,r);if(r.criteres)grid.set([r.criteres.tache,r.criteres.coherence,r.criteres.lexique,r.criteres.grammaire])}
    }},'🤖 Faire corriger par Claude'):null;
    root.append(
      h('div',{class:'resbox'},h('b',{},'Bilan automatique'),
        h('p',{class:'sub'},n+' mots · '+(n>=item.min&&n<=item.max?'longueur conforme':n<item.min?'texte trop court':'texte trop long')),
        h('p',{class:'sub'},'Connecteurs repérés : '+(cn.length?cn.join(', '):'aucun (pense à structurer)'))),
      askBtn,fbBox,
      h('details',{},h('summary',{},'Voir un modèle de réponse'),h('p',{class:'model'},item.mod)),
      h('h3',{class:'lvl'},'Ma grille d\'évaluation'),
      h('p',{class:'sub'},'Évalue-toi (ou reprends la proposition de Claude) : 5 points par critère.'),
      grid.el,
      h('button',{class:'btn wide',onclick:()=>fin(grid.total(),{words:n})},B.pi+1<B.parts.length?'Valider et continuer →':'Valider ma note'));
    window.scrollTo(0,0);
  }
}
function eoScreen(item,fin,title){
  const st={speech:'',answers:[],qi:0,notes:''};
  let tm=null;
  const root=h('div',{class:'stage scroll'});
  const back=()=>{if(tm)tm.stop();stopSpeak();bacScreen()};
  app.replaceChildren(bar(back,title),root);
  const docBox=()=>h('div',{class:'note'},h('b',{},item.t),h('p',{class:'tt'},item.doc),h('p',{class:'sub'},'Consigne : '+item.cons));
  function prep(){
    tm=timerEl(10*60);
    const ta=h('textarea',{class:'ta',rows:'6',placeholder:'Mes notes (idées, plan, mots utiles)…',spellcheck:'false'});
    ta.addEventListener('input',()=>{st.notes=ta.value});
    root.replaceChildren(
      h('div',{class:'row between'},h('h2',{},'Préparation'),tm.el),
      h('p',{class:'sub'},'Lis le document, prépare ton plan (introduction, 2-3 idées, avis personnel, conclusion). 10 minutes conseillées.'),
      docBox(),
      audioPossible()?h('div',{class:'row'},h('button',{class:'btn ghost',onclick:()=>say(item.doc,1,IT)},'🔊 Écouter le document')):null,
      h('details',{},h('summary',{},'Aide : connecteurs et opinions'),h('ul',{},CONN.concat(OPIN).map(x=>h('li',{},x)))),
      ta,
      h('button',{class:'btn wide',onclick:()=>{tm.stop();speech()}},'Je suis prêt(e) : passer à l\'exposé →'));
  }
  function speech(){
    tm=timerEl(5*60);
    const w=micAvailable()?micWidget(IT,t=>{st.speech=t}):null;
    root.replaceChildren(
      h('div',{class:'row between'},h('h2',{},'Exposé (5 min)'),tm.el),
      h('p',{class:'sub'},'Présente le document, développe tes idées puis donne ton avis. Parle à voix haute, sans lire tes notes.'),
      h('details',{},h('summary',{},'Revoir le document et mes notes'),docBox(),h('p',{class:'sub'},st.notes||'(pas de notes)')),
      w?w.el:h('p',{class:'note'},'La transcription n\'est pas disponible ici : parle à voix haute (idéalement en t\'enregistrant avec ton téléphone) et évalue-toi à la fin.'),
      h('button',{class:'btn wide',onclick:()=>{tm.stop();talk()}},'Terminer l\'exposé → entretien'));
  }
  function talk(){
    if(st.qi===0)tm=timerEl(5*60);
    if(st.qi>=item.qs.length){tm.stop();review();return}
    const qn=item.qs[st.qi];
    const w=micAvailable()?micWidget(IT,t=>{st.answers[st.qi]=t}):null;
    root.replaceChildren(
      h('div',{class:'row between'},h('h2',{},'Entretien'),tm.el),
      h('p',{class:'sub'},'Question '+(st.qi+1)+' / '+item.qs.length+' · l\'examinateur te parle'),
      h('div',{class:'note'},h('p',{class:'tt big2'},qn)),
      audioPossible()?h('div',{class:'row'},h('button',{class:'btn ghost',onclick:()=>say(qn,1,IT)},'🔊 Réécouter la question'),h('button',{class:'btn ghost',onclick:()=>say(qn,.7,IT)},'🐢 Plus lentement')):null,
      w?w.el:h('p',{class:'sub'},'Réponds à voix haute (30 secondes à 1 minute).'),
      h('button',{class:'btn wide',onclick:()=>{st.qi++;talk()}},st.qi+1<item.qs.length?'Question suivante →':'Terminer l\'entretien'));
    setTimeout(()=>say(qn,1,IT),300);
  }
  function review(){
    const all=[st.speech].concat(st.answers.filter(Boolean)).join(' ').trim();
    const fbBox=h('div',{class:'fbbox'},'');
    const grid=gridEl(['Contenu et organisation','Lexique','Grammaire','Prononciation et intonation','Aisance et interaction'],4);
    const cn=connCount(all);
    const askBtn=capSample&&all?h('button',{class:'btn wide ghost',onclick:async()=>{
      askBtn.disabled=true;
      const prompt='Tu es examinateur de langue italienne au baccalauréat français (niveau B1). Voici la transcription automatique, parfois imparfaite, de l\'exposé et de l\'entretien oral d\'un élève. Ne pénalise pas les erreurs de transcription ni la ponctuation.\nDocument : '+item.doc+'\nConsigne : '+item.cons+'\nExposé : '+(st.speech||'(non transcrit)')+'\nEntretien :\n'+item.qs.map((q,i)=>'Q : '+q+'\nR : '+(st.answers[i]||'(non transcrit)')).join('\n')+'\nRéponds uniquement par un JSON {"note_sur_20":number,"points_forts":["..."],"erreurs":[{"extrait":"...","correction":"...","explication":"... en français"}],"version_amelioree":"une meilleure version de l\'exposé en italien, 80 à 120 mots","conseils":["..."]}. Maximum 8 erreurs. Explications bienveillantes et en français.';
      const r=await askClaude(prompt,fbBox);askBtn.disabled=false;
      if(r)renderFeedback(fbBox,r);
    }},'🤖 Faire analyser par Claude'):null;
    root.replaceChildren(
      h('h2',{},'Bilan de l\'oral'),
      st.speech||st.answers.some(Boolean)?h('div',{class:'resbox'},h('b',{},'Ce que j\'ai entendu'),h('p',{class:'sub'},'Exposé : '+(st.speech||'—')),st.answers.map((a,i)=>a?h('p',{class:'sub'},'Q'+(i+1)+' : '+a):null),h('p',{class:'sub'},'Connecteurs repérés : '+(cn.length?cn.join(', '):'aucun'))):h('p',{class:'note'},'Pas de transcription disponible : utilise la grille pour t\'évaluer.'),
      askBtn,fbBox,
      h('h3',{class:'lvl'},'Ma grille d\'évaluation'),
      h('p',{class:'sub'},'Évalue-toi honnêtement : 4 points par critère.'),
      grid.el,
      h('button',{class:'btn wide',onclick:()=>fin(grid.total(),{})},'Valider ma note'));
    window.scrollTo(0,0);
  }
  prep();
}

boot();
